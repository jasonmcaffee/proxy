[package]
name = "proxy-rs"
version = "1.0.0"
edition = "2024"
description = "Streaming reverse proxy for Jason McAffee services"
license = "UNLICENSED"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bytes = "1.10"
dotenvy = "0.15"
futures-util = "=0.3.31"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
napi = { version = "3.4", default-features = false, features = ["napi8"] }
napi-derive = "3.3"
prometheus = "0.14"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }

[build-dependencies]
napi-build = "2.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
